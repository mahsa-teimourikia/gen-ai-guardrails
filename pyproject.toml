[project]
name = "gen-ai-guardrails-learning"
version = "0.1.0"
description = "Provider-neutral learning examples for GenAI guardrails"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
learner = [
    "jupyterlab>=4.6,<5",
    "ipykernel>=7.4,<8",
    "pydantic>=2.13,<3",
]
contributor = [
    "gen-ai-guardrails-learning[learner]",
    "pytest>=9.1,<10",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = []
