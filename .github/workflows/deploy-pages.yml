name: Deploy learning hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "github-pages/**"
      - "quiz/**"
      - "assets/**"
      - "scripts/*.mjs"
      - "tests/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Learning Hub links
        run: npm run check:pages-links
      - name: Run quiz tests
        run: npm run test
      - name: Build and smoke test static site
        run: npm run test:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
