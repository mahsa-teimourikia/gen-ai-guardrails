name: Execute changed notebooks

on:
  pull_request:
    paths:
      - "**/*.ipynb"
      - "curriculum/**/*.py"
      - "scripts/run_notebooks.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Sync locked contributor environment
        run: uv sync --locked --extra contributor
      - name: Execute changed notebooks
        if: github.event_name == 'pull_request'
        run: uv run --locked --extra contributor python scripts/run_notebooks.py --base origin/${{ github.base_ref }}
      - name: Execute all notebooks
        if: github.event_name == 'workflow_dispatch'
        run: uv run --locked --extra contributor python scripts/run_notebooks.py
